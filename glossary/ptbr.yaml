version: 1
locale: pt-BR
authority: "Localização oficial PT-BR de Skyrim + consenso da comunidade"
updated: "2026-10-29"

style:
  address: voce
  register: "neutro brasileiro; informal para NPCs comuns, formal para nobres/guardas"
  contractions: "naturais (pra, tá, cê) só em personagens específicos"
  numbers: "escrever por extenso quando o TTS puder ler errado"
  punctuation: "manter travessão, aspas e reticências do original"
  proper_nouns: "em dúvida, manter o nome em inglês (padrão da localização oficial)"

